short_bio: >-
  <p>
    I am a third-year undergraduate student at Cornell University studying Engineering Physics with interests in atomic physics and experimental quantum science. My research experience spans nonlinear and quantum optics, atomic magnetometry, and trapped-ion systems. I am particularly interested in quantum technologies for sensing, precision measurement, communication, and information processing.
  </p>
  <p>
    I am currently an undergraduate research assistant working under <a href="https://www.duffield.cornell.edu/people/or-katz/" target="_blank">Prof. Or Katz</a> at Cornell on quantum sensing for the <a href="https://iontrap.aep.cornell.edu/research/dark-matter/" target="_blank">dark matter search</a>. 
    Previously under Prof. Katz, I co-led efforts towards a novel photonic quantum memory with the <a href="https://cornellqca.com/#/" target="_blank">Cornell Quantum Computing Association</a> and worked on beam delivery optics for the group's Ba<sup>137</sup> ion trap. 
  </p>
  <p>
    In Summer 2025, I joined <a href="https://www.sri.com/quantum" target="_blank">SRI International</a> as a Quantum Sciences Intern in the Applied Systems and Technology Division, where I worked on system integration of atomic magnetometers for pointing, navigation, and timing (PNT) problems in collaboration with <a href="https://twinleaf.com/" target="_blank">Twinleaf</a> and the <a href="https://romalis.scholar.princeton.edu/" target="_blank">Romalis Group</a> at Princeton. Earlier, I was a research assistant in the <a href="https://disa.aep.cornell.edu/" target="_blank">Disa Lab</a> at Cornell working on ultrafast pulse compression for terahertz generation and spectroscopy of ferroelectric and ferromagnetic materials. 
  </p>
  <p>
    Research keywords: <span class="text-hl"><u>atomic physics</u></span>, <span class="text-hl"><u>quantum sensing</u></span>, <span class="text-hl"><u>optical communication</u></span>, and <span class="text-hl"><u>precision measurement</u></span>.
  </p>
  <p>
  I am actively seeking Ph.D. and industry positions starting Fall 2027. If you or any of your colleagues are interested in my profile, please feel free to reach out!
  </p>

