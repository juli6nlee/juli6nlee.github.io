- title: "Ion Trap Delivery Board"
  description: "In Spring 2024, I joined the Katz Group and worked on designing and building the beam delivery optics for 493, 650, and 1762nm lasers in the Ba<sup>137</sup> ion trap. This involved characterizing beam divergence, chromatic shifts, and optical abberations followed by designing the delivery board in Autodesk Fusion and fabricating components in-house."
  image: /assets/images/photos/delivery.png
  skills:
    - "Gaussian Optics"
    - "Fiber Optics"
    - "Autodesk Fusion"
    - "Python"

- title: "Nonlinear Pulse Compressor"
  description: "During the summer of 2024, I designed and implemented a nonlinear pulse compressor for terahertz generation and spectroscopy under Prof. Ankit Disa. The project aimed to broaden the spectral bandwidth and shorten the duration of femtosecond laser pulses such that they could be used for cavity engineering to probe the ferroelectric soft mode of strontium titanate (SrTiO3). I was able to compress the pulses by three times and image the spectra with frequency-resolved optical grating (FROG)."
  image: /assets/images/photos/plkm.png
  skills:
    - "Nonlinear Optics"
    - "Python"
    - "MATLAB"