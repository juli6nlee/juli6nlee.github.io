- title: "Quantum Sensing for Dark Matter Detection"
  description: "I am currently building a precision setup for dark matter detection using a novel dual-probe scheme for alkali-noble gas magnetometry, advised by Prof. Or Katz. The project involves optical design, characterization, and photon shot noise-limited balanced photodetection to investigate axion-like particle coupling to electrons and neutrons."
  image: /assets/images/photos/darkmatter.png
  link: https://iontrap.aep.cornell.edu/research/dark-matter/
  skills:
    - "Atomic Physics"
    - "Optics"
    - "Autodesk Fusion"
    - "Python"
    - "Mathematica"

- title: "Quantum Sciences Internship at SRI International"
  description: "In Summer 2025, I worked on system integration of atomic magnetometers for localization problems at SRI in Princeton, NJ. My work included tuning FPGA-controlled DBR lasers to optimize device sensitivity, developing the software pipeline for integrated data acquisition, sensor fusion, and signal processing through an interactive GUI, and implementing an automated testbed for optical characterization."
  image: /assets/images/photos/sri.jpg
  link: https://www.sri.com/quantum
