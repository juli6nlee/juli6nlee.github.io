<style>
    .navbar-custom {
      background-color: var(--navbar-bg);
      color: var(--navbar-text);
    }
  
    .navbar-custom .navbar-brand {
      color: var(--navbar-text);
      /* font-family: "Zilla Slab Highlight", serif; */
      font-family: 'Bitcount Prop Single Ink', system-ui;
    }
  
    .navbar-custom .nav-link {
      color: var(--navbar-text);
    }
  
    .navbar-custom .nav-link:hover {
      color: #ff6f61;
    }

    .theme-toggle {
      width: 2.5rem;
      height: 2.5rem;
      margin-left: 0.9rem;
      border: 1px solid var(--theme-toggle-border);
      border-radius: 999px;
      background: var(--theme-toggle-bg);
      color: var(--theme-toggle-icon);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .theme-toggle:hover {
      background-color: var(--theme-toggle-hover);
      color: var(--theme-toggle-icon);
    }

    .theme-toggle .fa-sun {
      display: none;
    }

    [data-theme="dark"] .theme-toggle .fa-sun {
      display: inline-block;
    }

    [data-theme="dark"] .theme-toggle .fa-moon {
      display: none;
    }

    @media (max-width: 575.98px) {
      .theme-toggle {
        margin-left: 0.5rem;
      }
    }
  </style>
  
  <nav class="navbar navbar-expand-sm navbar-custom fixed-top mb-5 shadow-sm">
    <!-- <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-fluid{% endif %}"> -->
    <!-- <div class="container-fluid pl-4 pr-0"> -->
    <div class="container pl-4 pr-0" style="max-width: 1700px;">
      <div class="row w-100 justify-content-center">
        <div class="col-12 col-lg-10 d-flex justify-content-between align-items-center">
          <a class="navbar-brand d-inline-flex align-items-end" href="{{ '/' | relative_url }}">
            <strong style="margin-right: 0.4em;">{{site.data.profile.navbar_name}}</strong>
            <!--<i class="fas fa-mouse-pointer" style="color: #ff6f61; font-size: 1rem; margin-bottom: -3px;"></i> -->
          </a>
          <button class="navbar-toggler" style="font-size: 1em; padding: 0.5em;" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-map"></i> Menu
          </button>
  
          <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
              {% if page.navbar_title == "Home" %}
              <li class="nav-item"><a class="nav-link" style="font-size: 1.1rem" href="#about">About</a></li>
              <li class="nav-item"><a class="nav-link" style="font-size: 1.1rem" href="#news">News</a></li>
              <li class="nav-item"><a class="nav-link" style="font-size: 1.1rem" href="#publications">Publications</a></li>
              <li class="nav-item"><a class="nav-link" style="font-size: 1.1rem" href="#projects">Projects</a></li>
              <li class="nav-item"><a class="nav-link" style="font-size: 1.1rem" href="#contact">Contact</a></li>
              {% else %}
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title %}active{% endif %}">
                  <a class="nav-link" style="font-size: 1.1rem" href="{{ item.url | relative_url }}">{{ item.name }}</a>
                </li>
                {% endfor %}
              {% endif %}
            </ul>
          </div>
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to dark mode"
            title="Toggle dark mode"
          >
            <i class="fas fa-moon" aria-hidden="true"></i>
            <i class="fas fa-sun" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>
